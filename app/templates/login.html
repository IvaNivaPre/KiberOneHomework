{% extends "base.html" %}

{% block title %}Вход — KIBERone{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 sm:p-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="mb-4 flex items-center justify-center">
                <img src="https://kiber-one.com/img/redesign2/logo.svg"
                     onerror="this.onerror=null; this.src='/static/img/kiberone_logo.svg';"
                     alt="KIBERone"
                     class="h-10 w-auto">
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Личный кабинет</h1>
            <p class="text-xs text-slate-500 mt-1">Платформа сдачи домашних заданий KIBERone</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold flex items-center space-x-3">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-base"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-black uppercase tracking-wider text-slate-700 mb-1.5">Логин</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus
                           placeholder="Введите логин"
                           class="w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#13c9ba] focus:border-transparent text-sm font-medium transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-black uppercase tracking-wider text-slate-700 mb-1.5">Пароль</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#13c9ba] focus:border-transparent text-sm font-medium transition">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3.5 px-4 bg-[#f7c90e] hover:bg-[#dfb408] text-slate-950 font-black rounded-2xl shadow-lg shadow-[#f7c90e]/30 transition transform active:scale-98 flex items-center justify-center space-x-2 cursor-pointer">
                <span>Войти в аккаунт</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

    </div>
</div>
{% endblock %}
